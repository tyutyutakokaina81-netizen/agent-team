## R33 起動経路（008の質問への回答）
dispatch.log の起動時刻（秒）と worker ログの exit_code を突き合わせた:
- **失敗**（Not logged in / `fatal: failed to store: -61`＝キーチェーンに書き込めない）：
  01:35:02, 01:40:03, 01:45:03, 02:00:03, 03:00:03, 03:20:03, 03:30:03, 11-12 09:25:07, 09:30:03
  → 全部 :0x 秒台＝**crontab の `*/5 * * * * worker_dispatcher.sh`**
- **成功**：03:10:33, 09:06:43, 11-12 09:19:42, 07:17（毎日）
  → 秒がばらばら＝**launchd の com.agentteam.dispatcher（StartInterval 300）**と **com.agentteam.daily（07:17・run_worker.sh）**
- 配車係は**crontab と launchd の両方に登録されていて**、同じ dispatch.log に書いている。ログに出るのは先に要求を取ったほう
- 原因の見立て【考察】：cron のプロセスからはログインキーチェーンにアクセスできず、claude の認証が読めない（-61）。launchd の LaunchAgent はユーザーセッション内なので読める
- 対処の提案：crontab から worker_dispatcher.sh の行を消す（launchd 側が同じ5分間隔で動いている）。**消していない**（crontab の削除は owner/code の判断）
- ついでに見つけたもの：crontab に `17 7 * * * ... claude -p "$(cat docs/worker-prompt.txt)" >> worker.log` も残っていて、launchd の com.agentteam.daily（07:17）と**同時刻に二重で起動**している。cron 側は同じ理由で失敗しているはず（worker.log）。これも消すのが安全

