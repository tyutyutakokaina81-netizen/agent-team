（自動応募ボットはA1で不可＋規約BANの自爆リスクで不採用／owner=唯一の外部接点／送信は人間が行う）
と矛盾する。接続が復旧しても、この確定方針を優先し**送信はせずドラフト作成のみ**とする運用を継続中。

