/chunks/88316-a66fc10881449e45.js\",\"89324\",\"static/chunks/89324-c90fe6118cdbe1a2.js\",\"62730\",\"static/chunks/62730-340f20a2834eaac7.js\",\"2363\",\"static/chunks/2363-43565aaf508507ae.js\",\"79951\",\"static/chunks/79951-704d9b2ab858ba83.js\",\"25623\",\"static/chunks/25623-7f44af3fed9ad9c9.js\",\"57705\",\"static/chunks/57705-ebeb174ac2f6e7d0.js\",\"55810\",\"static/chunks/55810-0c94792ce5d07094.js\",\"27866\",\"static/chunks/27866-cc030f5d8c696756.js\",\"75713\",\"static/chunks/75713-b70b496110993c7d.js\",\"24426\",\"static/chunks/24426-d7b43d717bbb2b3f.js\",\"9878\",\"static/chunks/9878-39bed8ea9f9828d2.js\",\"2091\",\"static/chunks/app/(with-navbar)/%5Burlname%5D/n/%5BnoteKey%5D/page-afd4e687fe4685f3.js\"],\"Hydrate\"]\n41:T1d2b,\u003cp name=\"afe6eb48-cdbd-4ee3-8b9b-f91e5972372e\" id=\"afe6eb48-cdbd-4ee3-8b9b-f91e5972372e\"\u003e九月に入ると、富山のスーパーや直売所に「新米」の文字が並び始める。その年に収穫されたばかりの米だ。同じ品種、同じ産地の米でも、新米と、去年から蔵にあった米では、炊き上がりがはっきり違う。海外から来た人には「米は米でしょう」と思われるかもしれない。だが、日本では新米が出回る時期は、ちょっとした季節の行事のようなものだ。富山は、その新米がとりわけおいしいと言われる土地でもある。\u003c/p\u003e\u003cp name=\"19a9c842-fd96-42ce-a209-c88ddd0b1aff\" id=\"19a9c842-fd96-42ce-a209-c88ddd0b1aff\"\u003e## 新米は何が違うのか\u003c/p\u003e\u003cp name=\"f66ee2b8-d06f-425b-88a7-7cf2a8b0bf74\" id=\"f66ee2b8-d06f-425b-88a7-7cf2a8b0bf74\"\u003eいちばんの違いは、水分だ。収穫されたばかりの米は水分を多く含んでいる。だから炊くと、粒がふっくらと立ち、つやが出て、少しもちっとする。噛むと、ほのかな甘みと、新しい米特有の青いような香りがある。時間が経った米は水分が抜けていくので、同じように炊いても、この「みずみずしさ」は薄れていく。\u003c/p\u003e\u003cp name=\"8b4624ff-2698-47f5-ba9c-247e8cea8388\" id=\"8b4624ff-2698-47f5-ba9c-247e8cea8388\"\u003eただし、これは「新米が絶対においしい」という話ではない。水分が多いぶん、炊くときの水加減を少し減らすとよい、と料理をする人はよく言う。逆に、少し寝かせた米のほうが、味が落ち着いて好きだという人もいる。新米のよさは「フレッシュさ」であって、それを好むかは人による。\u003c/p\u003e\u003cp name=\"b886098b-c8b0-4368-b440-cdd89f31765c\" id=\"b886098b-c8b0-4368-b440-cdd89f31765c\"\u003e## なぜ富山の米はよく名前が挙がるのか\u003c/p\u003e\u003cp name=\"95aa19ec-3573-4575-a193-e9a24cee9875\" id=\"95aa19ec-3573-4575-a193-e9a24cee9875\"\u003e富山が米どころとして知られる背景には、いくつかの条件がある。よく語られるのは、立山連峰からの豊かな水と、昼夜の寒暖差だ。実りの時期に昼は暖かく夜は涼しいと、米の甘みにつながるとされる。広い平野があり、水が豊富で、寒暖差もある——この組み合わせが、米づくりに向いていると言われてきた。\u003c/p\u003e\u003cp name=\"a4cf170b-b6b2-457c-871c-70429087aa3c\" id=\"a4cf170b-b6b2-457c-871c-70429087aa3c\"\u003e品種でいえば、全国的に有名なコシヒカリのほか、近年は富山県が開発した品種も出回っている。どれがおいしいかは、好みと、その年の天候にもよる。だから「この品種が一番」と断定はしない。言えるのは、富山には米づくりに向いた土地の条件がそろっている、という一般的な傾向までだ。\u003c/p\u003e\u003cp name=\"f26c2bb8-6dbd-4631-a21d-5985d94ee549\" id=\"f26c2bb8-6dbd-4631-a21d-5985d94ee549\"\u003e## 新米のいちばんおいしい食べ方\u003c/p\u003e\u003cp name=\"25fd3bf2-c842-4224-a8e3-22ceca28190d\" id=\"25fd3bf2-c842-4224-a8e3-22ceca28190d\"\u003e新米が手に入ったら、まずは何も足さずに食べてみてほしい。おかずを工夫するより、炊きたてのご飯そのものを味わうのが、新米の季節の楽しみ方だ。\u003c/p\u003e\u003cp name=\"b154b20c-c370-4daf-ab41-2dbb3a6ceb0b\" id=\"b154b20c-c370-4daf-ab41-2dbb3a6ceb0b\"\u003e炊きたてを茶碗によそい、湯気が立っているうちに、そのまま一口。次に、塩をほんの少しだけ。塩は米の甘みを引き立てる。それから、シンプルなおかず——焼いた魚、漬物、卵、味噌汁——を合わせる。派手なおかずは要らない。むしろ、ご飯が主役で、おかずが脇役になる。これが、新米の時期のごちそうだ。\u003c/p\u003e\u003cp name=\"919abf3e-1067-4e4d-84e3-d672373ecb8a\" id=\"919abf3e-1067-4e4d-84e3-d672373ecb8a\"\u003e炊く水も、少しだけ気にしてみたい。米は炊くときに大量の水を吸うので、水の質が炊き上がりに出る、と料理をする人はよく言う。富山は水がよい土地とされるから、その土地の米を、その土地の水で炊く——それだけで、新米のよさがまっすぐ伝わりやすい。旅先の宿で出てくる炊きたての一杯が、家で食べるものと少し違って感じるとしたら、米と水の両方が理由かもしれない。\u003c/p\u003e\u003cp name=\"06821517-e53a-4eb6-9b20-039e4f17b7d1\" id=\"06821517-e53a-4eb6-9b20-039e4f17b7d1\"\u003e余った新米は、冷めてもおいしい。おにぎりにすると、その違いがよく分かる。冷めても粒が立っていて、固くなりにくい。だから、新米の季節のおにぎりは、特別な味がする。\u003c/p\u003e\u003cp name=\"4aacfff9-40da-4035-893d-a8bad51cc5a3\" id=\"4aacfff9-40da-4035-893d-a8bad51cc5a3\"\u003e## 新米はいつ、どこで買えるか\u003c/p\u003e\u003cp name=\"91415a48-6450-420f-a6b1-573f0f322b61\" id=\"91415a48-6450-420f-a6b1-573f0f322b61\"\u003e新米が店頭に並ぶ時期は、地域と品種で少しずつ違う。早いものは八月の終わりから、多くは九月に入ってから、遅い品種は十月にかけて出回る。袋に「新米」や「その年の産」と書かれているので、それを目印にするとよい。\u003c/p\u003e\u003cp name=\"09bd2d71-cfec-49e2-b500-5946cdebd968\" id=\"09bd2d71-cfec-49e2-b500-5946cdebd968\"\u003e買う場所によっても、性格が少し変わる。スーパーは手軽で品種もそろっている。だが、新米らしさをいちばん感じやすいのは、農家の直売所や道の駅だ。収穫からの時間が短く、精米したてを置いている店も多い。精米したての米は、時間が経つほど少しずつ風味が落ちていくとされるので、「いつ精米したか」を気にする人もいる。\u003c/p\u003e\u003cp name=\"3c87f40d-d289-4fd3-afa3-aa20e62efe09\" id=\"3c87f40d-d289-4fd3-afa3-aa20e62efe09\"\u003e量は、少なめにこまめに買うのがおすすめだ。新米のみずみずしさは、時間とともに薄れていく。大きな袋で買って何ヶ月もかけて食べるより、小さめの袋を何度か買うほうが、そのフレッシュさを楽しめる。保存は、暑い場所や直射日光を避け、できれば冷蔵庫の野菜室に入れておくと風味が長持ちするとされる。旅行者なら、真空パックの小袋は土産にもしやすい。\u003c/p\u003e\u003cp name=\"5bc39da4-f39d-4e47-aed7-31e01cecdfb5\" id=\"5bc39da4-f39d-4e47-aed7-31e01cecdfb5\"\u003e## 一杯のご飯を、季節として味わう\u003c/p\u003e\u003cp name=\"b9434a77-3925-455c-9d10-29ea56732a7e\" id=\"b9434a77-3925-455c-9d10-29ea56732a7e\"\u003e海外では、米は一年を通じて同じもの、という感覚が強いかもしれない。だが日本では、米にも「旬」がある。春に田を植え、夏に育て、秋に収穫する。その一年の締めくくりが、新米の一杯だ。\u003c/p\u003e\u003cp name=\"bb3f0442-ec88-4207-82de-69cb45d2f88f\" id=\"bb3f0442-ec88-4207-82de-69cb45d2f88f\"\u003e富山を秋に訪れたら、旅館や食堂で出てくるご飯に、少しだけ意識を向けてみてほしい。もし新米の時期なら、そのつやと香りに、この土地の水と土と一年の手間が詰まっている。名所を回る合間の、何気ない一杯のご飯が、実はいちばん富山らしい味かもしれない。\u003c/p\u003e7:[[\"$\",\"$L3b\",null,{\"noteId\":177652191,\"creatorUserId\":14185635}],[\"$\",\"$L3c\",null,{\"children\":[[\"$\",\"$L3d\",null,{}],[\"$\",\"$L3e\",null,{\"isPublished\":true,\"hasMembership\":false,\"noteId\":177652191,\"noteKey\":\"n59040531a80a\",\"creatorId\":14185635,\"creatorKey\":\"3f24c0c02b8db78cbc112d8e4d60016c\",\"creatorUrlname\":\"safe_canna441\",\"creatorName\":\"てつ\",\"creatorImageUrl\":\"https://assets.st-note.com/production/uploads/images/270087626/profile_17a96f088a56f81c4d9ab4a5acbc822c.jpg?width=60\",\"creatorHref\":\"https://note.com/safe_canna441\",\"membershipHref\":\"https://note.com/safe_canna441/membership\"}],[[\"$\",\"$L3f\",null,{\"appliedTranslationLang\":\"$undefined\"}],[\"$\",\"$L40\",null,{\"target\":{\"id\":177652191,\"userId\":14185635,\"status\":\"published\",\"type\":\"TextNote\",\"key\":\"n59040531a80a\",\"slug\":\"slug-n59040531a80a\",\"name\":\"富山の新米：秋いちばんの一杯が、なぜこんなに違うのか\",\"body\":\"$41\",\"separator\":null,\"description\":\"\",\"index\":[],\"externalUrl\":null,\"disableComment\":false,\"editableScopes\":[\"web\",\"ios\",\"android\"],\"nonEditableReason\" chunks/87514-35d5f116d1582e1d.js\",\"2324\",\"static/chunks/2324-416b5d1d9ddb3a26.js\",\"438\",\"static/chunks/438-f00f9f58d92b9bd0.js\",\"88316\",\"static/chunks/88316-a66fc10881449e45.js\",\"89324\",\"static/chunks/89324-c90fe6118cdbe1a2.js\",\"62730\",\"static/chunks/62730-340f20a2834eaac7.js\",\"2363\",\"static/chunks/2363-43565aaf508507ae.js\",\"79951\",\"static/chunks/79951-704d9b2ab858ba83.js\",\"25623\",\"static/chunks/25623-7f44af3fed9ad9c9.js\",\"57705\",\"static/chunks/57705-ebeb174ac2f6e7d0.js\",\"55810\",\"static/chunks/55810-0c94792ce5d07094.js\",\"27866\",\"static/chunks/27866-cc030f5d8c696756.js\",\"75713\",\"static/chunks/75713-b70b496110993c7d.js\",\"24426\",\"static/chunks/24426-d7b43d717bbb2b3f.js\",\"9878\",\"static/chunks/9878-39bed8ea9f9828d2.js\",\"2091\",\"static/chunks/app/(with-navbar)/%5Burlname%5D/n/%5BnoteKey%5D/page-afd4e687fe4685f3.js\"],\"NoteDetailModalBehavior\"]\n4d:T1d2b,\u003cp name=\"afe6eb48-cdbd-4ee3-8b9b-f91e5972372e\" id=\"afe6eb48-cdbd-4ee3-8b9b-f91e5972372e\"\u003e九月に入ると、富山のスーパーや直売所に「新米」の文字が並び始める。その年に収穫されたばかりの米だ。同じ品種、同じ産地の米でも、新米と、去年から蔵にあった米では、炊き上がりがはっきり違う。海外から来た人には「米は米でしょう」と思われるかもしれない。だが、日本では新米が出回る時期は、ちょっとした季節の行事のようなものだ。富山は、その新米がとりわけおいしいと言われる土地でもある。\u003c/p\u003e\u003cp name=\"19a9c842-fd96-42ce-a209-c88ddd0b1aff\" id=\"19a9c842-fd96-42ce-a209-c88ddd0b1aff\"\u003e## 新米は何が違うのか\u003c/p\u003e\u003cp name=\"f66ee2b8-d06f-425b-88a7-7cf2a8b0bf74\" id=\"f66ee2b8-d06f-425b-88a7-7cf2a8b0bf74\"\u003eいちばんの違いは、水分だ。収穫されたばかりの米は水分を多く含んでいる。だから炊くと、粒がふっくらと立ち、つやが出て、少しもちっとする。噛むと、ほのかな甘みと、新しい米特有の青いような香りがある。時間が経った米は水分が抜けていくので、同じように炊いても、この「みずみずしさ」は薄れていく。\u003c/p\u003e\u003cp name=\"8b4624ff-2698-47f5-ba9c-247e8cea8388\" id=\"8b4624ff-2698-47f5-ba9c-247e8cea8388\"\u003eただし、これは「新米が絶対においしい」という話ではない。水分が多いぶん、炊くときの水加減を少し減らすとよい、と料理をする人はよく言う。逆に、少し寝かせた米のほうが、味が落ち着いて好きだという人もいる。新米のよさは「フレッシュさ」であって、それを好むかは人による。\u003c/p\u003e\u003cp name=\"b886098b-c8b0-4368-b440-cdd89f31765c\" id=\"b886098b-c8b0-4368-b440-cdd89f31765c\"\u003e## なぜ富山の米はよく名前が挙がるのか\u003c/p\u003e\u003cp name=\"95aa19ec-3573-4575-a193-e9a24cee9875\" id=\"95aa19ec-3573-4575-a193-e9a24cee9875\"\u003e富山が米どころとして知られる背景には、いくつかの条件がある。よく語られるのは、立山連峰からの豊かな水と、昼夜の寒暖差だ。実りの時期に昼は暖かく夜は涼しいと、米の甘みにつながるとされる。広い平野があり、水が豊富で、寒暖差もある——この組み合わせが、米づくりに向いていると言われてきた。\u003c/p\u003e\u003cp name=\"a4cf170b-b6b2-457c-871c-70429087aa3c\" id=\"a4cf170b-b6b2-457c-871c-70429087aa3c\"\u003e品種でいえば、全国的に有名なコシヒカリのほか、近年は富山県が開発した品種も出回っている。どれがおいしいかは、好みと、その年の天候にもよる。だから「この品種が一番」と断定はしない。言えるのは、富山には米づくりに向いた土地の条件がそろっている、という一般的な傾向までだ。\u003c/p\u003e\u003cp name=\"f26c2bb8-6dbd-4631-a21d-5985d94ee549\" id=\"f26c2bb8-6dbd-4631-a21d-5985d94ee549\"\u003e## 新米のいちばんおいしい食べ方\u003c/p\u003e\u003cp name=\"25fd3bf2-c842-4224-a8e3-22ceca28190d\" id=\"25fd3bf2-c842-4224-a8e3-22ceca28190d\"\u003e新米が手に入ったら、まずは何も足さずに食べてみてほしい。おかずを工夫するより、炊きたてのご飯そのものを味わうのが、新米の季節の楽しみ方だ。\u003c/p\u003e\u003cp name=\"b154b20c-c370-4daf-ab41-2dbb3a6ceb0b\" id=\"b154b20c-c370-4daf-ab41-2dbb3a6ceb0b\"\u003e炊きたてを茶碗によそい、湯気が立っているうちに、そのまま一口。次に、塩をほんの少しだけ。塩は米の甘みを引き立てる。それから、シンプルなおかず——焼いた魚、漬物、卵、味噌汁——を合わせる。派手なおかずは要らない。むしろ、ご飯が主役で、おかずが脇役になる。これが、新米の時期のごちそうだ。\u003c/p\u003e\u003cp name=\"919abf3e-1067-4e4d-84e3-d672373ecb8a\" id=\"919abf3e-1067-4e4d-84e3-d672373ecb8a\"\u003e炊く水も、少しだけ気にしてみたい。米は炊くときに大量の水を吸うので、水の質が炊き上がりに出る、と料理をする人はよく言う。富山は水がよい土地とされるから、その土地の米を、その土地の水で炊く——それだけで、新米のよさがまっすぐ伝わりやすい。旅先の宿で出てくる炊きたての一杯が、家で食べるものと少し違って感じるとしたら、米と水の両方が理由かもしれない。\u003c/p\u003e\u003cp name=\"06821517-e53a-4eb6-9b20-039e4f17b7d1\" id=\"06821517-e53a-4eb6-9b20-039e4f17b7d1\"\u003e余った新米は、冷めてもおいしい。おにぎりにすると、その違いがよく分かる。冷めても粒が立っていて、固くなりにくい。だから、新米の季節のおにぎりは、特別な味がする。\u003c/p\u003e\u003cp name=\"4aacfff9-40da-4035-893d-a8bad51cc5a3\" id=\"4aacfff9-40da-4035-893d-a8bad51cc5a3\"\u003e## 新米はいつ、どこで買えるか\u003c/p\u003e\u003cp name=\"91415a48-6450-420f-a6b1-573f0f322b61\" id=\"91415a48-6450-420f-a6b1-573f0f322b61\"\u003e新米が店頭に並ぶ時期は、地域と品種で少しずつ違う。早いものは八月の終わりから、多くは九月に入ってから、遅い品種は十月にかけて出回る。袋に「新米」や「その年の産」と書かれているので、それを目印にするとよい。\u003c/p\u003e\u003cp name=\"09bd2d71-cfec-49e2-b500-5946cdebd968\" id=\"09bd2d71-cfec-49e2-b500-5946cdebd968\"\u003e買う場所によっても、性格が少し変わる。スーパーは手軽で品種もそろっている。だが、新米らしさをいちばん感じやすいのは、農家の直売所や道の駅だ。収穫からの時間が短く、精米したてを置いている店も多い。精米したての米は、時間が経つほど少しずつ風味が落ちていくとされるので、「いつ精米したか」を気にする人もいる。\u003c/p\u003e\u003cp name=\"3c87f40d-d289-4fd3-afa3-aa20e62efe09\" id=\"3c87f40d-d289-4fd3-afa3-aa20e62efe09\"\u003e量は、少なめにこまめに買うのがおすすめだ。新米のみずみずしさは、時間とともに薄れていく。大きな袋で買って何ヶ月もかけて食べるより、小さめの袋を何度か買うほうが、そのフレッシュさを楽しめる。保存は、暑い場所や直射日光を避け、できれば冷蔵庫の野菜室に入れておくと風味が長持ちするとされる。旅行者なら、真空パックの小袋は土産にもしやすい。\u003c/p\u003e\u003cp name=\"5bc39da4-f39d-4e47-aed7-31e01cecdfb5\" id=\"5bc39da4-f39d-4e47-aed7-31e01cecdfb5\"\u003e## 一杯のご飯を、季節として味わう\u003c/p\u003e\u003cp name=\"b9434a77-3925-455c-9d10-29ea56732a7e\" id=\"b9434a77-3925-455c-9d10-29ea56732a7e\"\u003e海外では、米は一年を通じて同じもの、という感覚が強いかもしれない。だが日本では、米にも「旬」がある。春に田を植え、夏に育て、秋に収穫する。その一年の締めくくりが、新米の一杯だ。\u003c/p\u003e\u003cp name=\"bb3f0442-ec88-4207-82de-69cb45d2f88f\" id=\"bb3f0442-ec88-4207-82de-69cb45d2f88f\"\u003e富山を秋に訪れたら、旅館や食堂で出てくるご飯に、少しだけ意識を向けてみてほしい。もし新米の時期なら、そのつやと香りに、この土地の水と土と一年の手間が詰まっている。名所を回る合間の、何気ない一杯のご飯が、実はいちばん富山らしい味かもしれない。\u003c/p\u003e42:[\"$\",\"main\",null,{\"id\":\"main-content\",\"className\":\"relative\",\"children\":[[\"$\",\"div\",null,{\"className\":\"fixed top-24 left-8 max-[1124px]:hidden\",\"children\":[\"$\",\"$L17\",null,{\"children\":[\"$\",\"$L4b\",null,{\"creatorKey\":\"3f24c0c02b8db78cbc112d8e4d60016c\",\"creatorId\":14185635,\"avatarSrc\":\"https://assets.st-note.com/production/uploads/images/270087626/profile_17a96f088a56f81c4d9ab4a5acbc822c.jpg?width=60\",\"creatorName\":\"てつ\",\"urlname\":\"safe_canna441\",\"profile\":\"富山県高岡市在住ライター。北陸の食・工芸・港町を歩いて書く。英語も書きます。 高岡・氷見・富山の「まだ知られていない日常」を国内外へ。毎日更新中。\\nWriter in Takaoka, Toyama. Hokuriku food \u0026 craft — JP \u0026 EN. Daily.\",\"noteKey\":\"n59040531a80a\"}]}]}],[\"$\",\"div\",null,{\"children\":[null,null,[\"$\",\"article\",null,{\"className\":\"mx-auto w-auto md:w-[var(--size-content\\\\_small)]\",\"id\":\"note-article\",\"children\":[[\"$\",\"div\",null,{\"className\":\"mb-8 md:mb-12\",\"childr ks/57705-ebeb174ac2f6e7d0.js\",\"55810\",\"static/chunks/55810-0c94792ce5d07094.js\",\"27866\",\"static/chunks/27866-cc030f5d8c696756.js\",\"75713\",\"static/chunks/75713-b70b496110993c7d.js\",\"24426\",\"static/chunks/24426-d7b43d717bbb2b3f.js\",\"9878\",\"static/chunks/9878-39bed8ea9f9828d2.js\",\"2091\",\"static/chunks/app/(with-navbar)/%5Burlname%5D/n/%5BnoteKey%5D/page-afd4e687fe4685f3.js\"],\"ProfileSocialLinksView\"]\n6a:[\"$\",\"p\",\"0\",{\"name\":\"afe6eb48-cdbd-4ee3-8b9b-f91e5972372e\",\"id\":\"afe6eb48-cdbd-4ee3-8b9b-f91e5972372e\",\"children\":\"九月に入ると、富山のスーパーや直売所に「新米」の文字が並び始める。その年に収穫されたばかりの米だ。同じ品種、同じ産地の米でも、新米と、去年から蔵にあった米では、炊き上がりがはっきり違う。海外から来た人には「米は米でしょう」と思われるかもしれない。だが、日本では新米が出回る時期は、ちょっとした季節の行事のようなものだ。富山は、その新米がとりわけおいしいと言われる土地でもある。\"}]\n6b:[\"$\",\"p\",\"1\",{\"name\":\"19a9c842-fd96-42ce-a209-c88ddd0b1aff\",\"id\":\"19a9c842-fd96-42ce-a209-c88ddd0b1aff\",\"children\":\"## 新米は何が違うのか\"}]\n6c:[\"$\",\"p\",\"2\",{\"name\":\"f66ee2b8-d06f-425b-88a7-7cf2a8b0bf74\",\"id\":\"f66ee2b8-d06f-425b-88a7-7cf2a8b0bf74\",\"children\":\"いちばんの違いは、水分だ。収穫されたばかりの米は水分を多く含んでいる。だから炊くと、粒がふっくらと立ち、つやが出て、少しもちっとする。噛むと、ほのかな甘みと、新しい米特有の青いような香りがある。時間が経った米は水分が抜けていくので、同じように炊いても、この「みずみずしさ」は薄れていく。\"}]\n6d:[\"$\",\"p\",\"3\",{\"name\":\"8b4624ff-2698-47f5-ba9c-247e8cea8388\",\"id\":\"8b4624ff-2698-47f5-ba9c-247e8cea8388\",\"children\":\"ただし、これは「新米が絶対においしい」という話ではない。水分が多いぶん、炊くときの水加減を少し減らすとよい、と料理をする人はよく言う。逆に、少し寝かせた米のほうが、味が落ち着いて好きだという人もいる。新米のよさは「フレッシュさ」であって、それを好むかは人による。\"}]\n6e:[\"$\",\"p\",\"4\",{\"name\":\"b886098b-c8b0-4368-b440-cdd89f31765c\",\"id\":\"b886098b-c8b0-4368-b440-cdd89f31765c\",\"children\":\"## なぜ富山の米はよく名前が挙がるのか\"}]\n6f:[\"$\",\"p\",\"5\",{\"name\":\"95aa19ec-3573-4575-a193-e9a24cee9875\",\"id\":\"95aa19ec-3573-4575-a193-e9a24cee9875\",\"children\":\"富山が米どころとして知られる背景には、いくつかの条件がある。よく語られるのは、立山連峰からの豊かな水と、昼夜の寒暖差だ。実りの時期に昼は暖かく夜は涼しいと、米の甘みにつながるとされる。広い平野があり、水が豊富で、寒暖差もある——この組み合わせが、米づくりに向いていると言われてきた。\"}]\n70:[\"$\",\"p\",\"6\",{\"name\":\"a4cf170b-b6b2-457c-871c-70429087aa3c\",\"id\":\"a4cf170b-b6b2-457c-871c-70429087aa3c\",\"children\":\"品種でいえば、全国的に有名なコシヒカリのほか、近年は富山県が開発した品種も出回っている。どれがおいしいかは、好みと、その年の天候にもよる。だから「この品種が一番」と断定はしない。言えるのは、富山には米づくりに向いた土地の条件がそろっている、という一般的な傾向までだ。\"}]\n71:[\"$\",\"p\",\"7\",{\"name\":\"f26c2bb8-6dbd-4631-a21d-5985d94ee549\",\"id\":\"f26c2bb8-6dbd-4631-a21d-5985d94ee549\",\"children\":\"## 新米のいちばんおいしい食べ方\"}]\n72:[\"$\",\"p\",\"8\",{\"name\":\"25fd3bf2-c842-4224-a8e3-22ceca28190d\",\"id\":\"25fd3bf2-c842-4224-a8e3-22ceca28190d\",\"children\":\"新米が手に入ったら、まずは何も足さずに食べてみてほしい。おかずを工夫するより、炊きたてのご飯そのものを味わうのが、新米の季節の楽しみ方だ。\"}]\n73:[\"$\",\"p\",\"9\",{\"name\":\"b154b20c-c370-4daf-ab41-2dbb3a6ceb0b\",\"id\":\"b154b20c-c370-4daf-ab41-2dbb3a6ceb0b\",\"children\":\"炊きたてを茶碗によそい、湯気が立っているうちに、そのまま一口。次に、塩をほんの少しだけ。塩は米の甘みを引き立てる。それから、シンプルなおかず——焼いた魚、漬物、卵、味噌汁——を合わせる。派手なおかずは要らない。むしろ、ご飯が主役で、おかずが脇役になる。これが、新米の時期のごちそうだ。\"}]\n74:[\"$\",\"p\",\"10\",{\"name\":\"919abf3e-1067-4e4d-84e3-d672373ecb8a\",\"id\":\"919abf3e-1067-4e4d-84e3-d672373ecb8a\",\"children\":\"炊く水も、少しだけ気にしてみたい。米は炊くときに大量の水を吸うので、水の質が炊き上がりに出る、と料理をする人はよく言う。富山は水がよい土地とされるから、その土地の米を、その土地の水で炊く——それだけで、新米のよさがまっすぐ伝わりやすい。旅先の宿で出てくる炊きたての一杯が、家で食べるものと少し違って感じるとしたら、米と水の両方が理由かもしれない。\"}]\n75:[\"$\",\"p\",\"11\",{\"name\":\"06821517-e53a-4eb6-9b20-039e4f17b7d1\",\"id\":\"06821517-e53a-4eb6-9b20-039e4f17b7d1\",\"children\":\"余った新米は、冷めてもおいしい。おにぎりにすると、その違いがよく分かる。冷めても粒が立っていて、固くなりにくい。だから、新米の季節のおにぎりは、特別な味がする。\"}]\n76:[\"$\",\"p\",\"12\",{\"name\":\"4aacfff9-40da-4035-893d-a8bad51cc5a3\",\"id\":\"4aacfff9-40da-4035-893d-a8bad51cc5a3\",\"children\":\"## 新米はいつ、どこで買えるか\"}]\n77:[\"$\",\"p\",\"13\",{\"name\":\"91415a48-6450-420f-a6b1-573f0f322b61\",\"id\":\"91415a48-6450-420f-a6b1-573f0f322b61\",\"children\":\"新米が店頭に並ぶ時期は、地域と品種で少しずつ違う。早いものは八月の終わりから、多くは九月に入ってから、遅い品種は十月にかけて出回る。袋に「新米」や「その年の産」と書かれているので、それを目印にするとよい。\"}]\n78:[\"$\",\"p\",\"14\",{\"name\":\"09bd2d71-cfec-49e2-b500-5946cdebd968\",\"id\":\"09bd2d71-cfec-49e2-b500-5946cdebd968\",\"children\":\"買う場所によっても、性格が少し変わる。スーパーは手軽で品種もそろっている。だが、新米らしさをいちばん感じやすいのは、農家の直売所や道の駅だ。収穫からの時間が短く、精米したてを置いている店も多い。精米したての米は、時間が経つほど少しずつ風味が落ちていくとされるので、「いつ精米したか」を気にする人もいる。\"}]\n79:[\"$\",\"p\",\"15\",{\"name\":\"3c87f40d-d289-4fd3-afa3-aa20e62efe09\",\"id\":\"3c87f40d-d289-4fd3-afa3-aa20e62efe09\",\"children\":\"量は、少なめにこまめに買うのがおすすめだ。新米のみずみずしさは、時間とともに薄れていく。大きな袋で買って何ヶ月もかけて食べるより、小さめの袋を何度か買うほうが、そのフレッシュさを楽しめる。保存は、暑い場所や直射日光を避け、できれば冷蔵庫の野菜室に入れておくと風味が長持ちするとされる。旅行者なら、真空パックの小袋は土産にもしやすい。\"}]\n7a:[\"$\",\"p\",\"16\",{\"name\":\"5bc39da4-f39d-4e47-aed7-31e01cecdfb5\",\"id\":\"5bc39da4-f39d-4e47-aed7-31e01cecdfb5\",\"children\":\"## 一杯のご飯を、季節として味わう\"}]\n7b:[\"$\",\"p\",\"17\",{\"name\":\"b9434a77-3925-455c-9d10-29ea56732a7e\",\"id\":\"b9434a77-3925-455c-9d10-29ea56732a7e\",\"children\":\"海外では、米は一年を通じて同じもの、という感覚が強いかもしれない。だが日本では、米にも「旬」がある。春に田を植え、夏に育て、秋に収穫する。その一年の締めくくりが、新米の一杯だ。\"}]\n7c:[\"$\",\"p\",\"18\",{\"name\":\"bb3f0442-ec88-4207-82de-69cb45d2f88f\",\"id\":\"bb3f0442-ec88-4207-82de-69cb45d2f88f\",\"children\":\"富山を秋に訪れたら、旅館や食堂で出てくるご飯に、少しだけ意識を向けてみてほしい。もし新米の時期なら、そのつやと香りに、この土地の水と土と一年の手間が詰まっている。名所を回る合間の、何気ない一杯のご飯が、実はいちばん富山らしい味かもしれない。\"}]\n7d:[\"$\",\"$La6\",null,{}]\n7e:[false,false]\n7f:[\"$\",\"$La7\",null,{\"noteKey\":\"n59040531a80a\",\"noteType\":\"TextNote\",\"isPreview\":false,\"isEnabled\":true}]\n80:null\n94:[\"$\",\"$La8\",null,{\"creatorKey\":\"3f24c0c02b8db78cbc112d8e4d60016c\",\"noteKey\":\"n59040531a80a\",\"urlname\":\"safe_canna441\",\"isCreatorWithdrawn\":false}]\n95:[\"$\",\"$L17\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"rounded-lg bg-surface-quaternary h-8 w-[4.5rem]\",\"children\":\" \"}],\"children\":[\"$\",\"$La9\",null,{\"creatorKey\":\"3f24c0c02b8db78cbc112d8e4d60016c\",\"creatorId\":14185635,\"noteId\":177652191,\"noteKey\":\"n59040531a80a\",\"avatarSrc\":\"https://assets.st-note.com/production/uploads/images/270087626/profile_17a96f088a56f81c4d9ab4a5acbc822c.jpg?width=60\"}]}]\n96:[\"$\",\"div\",null,{\"className\":\"flex\",\"children\":[\"$\",\"$L17\",null,{\"children\":[\"$\",\"$Laa\",null,{\"noteKey\":\"n59040531a80a\"}]}]}]\n97:[\
