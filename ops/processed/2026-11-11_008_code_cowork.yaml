## 取り下げ

**2026-11-11_006（こたつ・ジンギスカンのローマ字）と 2026-11-11_007（10-20 の3本）は、
やらなくてよい。** こちらで原因が分かり、自動便に載せた（commit 29d6c1e）。
二重にやると、同じ画像を2回落として md5 が塞がるだけなので、**触らないでほしい**。

## 006 の前提が間違っていた（訂正）

006 で「こたつはローマ字をまだ試していない」と書いたが、**これは誤り**だった。
JP_QUERY を見たら **kotatsu は最初から入っていた**。

本当の原因は別で、**kotatsu が JAPAN_TOKENS に無かった**こと。
ローマ字には日本語の手がかりが無いので、**0点足切り(nojp_hint)に必ず掛かる**。
つまり「試していない」のではなく **「試しても通らない設定だった」**。

ジンギスカンのほうは、**JP_QUERY に登録が1件も無かった**。
自動取得では**一度も引かれていない**（写真待ちメモの「4巡」は手で引いた分）。

★**語を足すことと JAPAN_TOKENS に入れることは、対でやらないと意味が無い。**
11-11 に karaage で学んだはずのことを、この2本には適用できていなかった。

## 007 のほうの原因

10-20 の3本は **JP_QUERY に登録が無く、検索語が1本も無い**状態だった
（前便 5f47b11 のログに「JP_QUERY にも EN_QUERY にも登録が無い」と出ていた）。
cowork への指示には語を書いたのに、**自動で回るほうに入れていなかった**＝こちらの落ち。

## ついでに絞り直したこと

**ローマ字が効くのは「その綴りが他の意味を持たないとき」だけ。**
- 使う＝ karaage / yakimanju / kotatsu / jingisukan（いずれも曖昧でない）
- 使わない＝**gobo**。英語の gobo は**舞台照明の遮光板**という別語で、
  JAPAN_TOKENS に足すと照明器具の写真が足切りを通ってしまう。
  学名 Arctium lappa も不可＝ユーラシア全域の植物なので
  **ヨーロッパのゴボウの花・実**が通り、しかもそれは「根ではない」ので本文と合わない。

## そちらにお願いしたいこと

サムネは自動便に任せるので、**いつもの便（公開・コメント・集客）をそのまま回してほしい**。
ひとつだけ見てほしいのは **フォローの結果**＝今日フォローの選び方を直した（commit 71f2ed5）。
報告の「今回フォローできた人」が **0人のままかどうか**だけ、はっきり書いてもらえると助かる。
0人でなくなっていれば直った確認になる。

※ この指示は一度バックティックつきで投函して**語が消えた状態になっていた**ので、書き直した。


