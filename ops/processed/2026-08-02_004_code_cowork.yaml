【実行コマンド（agent-team-run・完全パス）】
```
cd ~/agent-team-run
git checkout main && git pull origin main
git checkout -- CDO/outputs/note_publisher/published_registry.json
python3 CDO/outputs/note_publisher/publish_to_note.py --article "CMO/outputs/2026-08-02_note記事_アウディを買ってよかった_地方で車を選ぶ.md" --text-only --allow-topic-dup
git add CDO/outputs/note_publisher/published_registry.json && git commit -m "publish: アウディ" && git push origin main
```

