2026-09-19 のオーナー実行で **7本すべてに見出し画像が付きました**（UPDATED 7/7）。

原因は**セレクタの誤り1点**でした。
  見出し画像ボタンは記事タイトル入力欄の直前にある黒丸のアイコンで、構造は
    div[data-dragging] > div > button[data-id=ButtonIcon] > span > span > svg[aria-label="画像を追加"]
  **aria-label は button ではなく中の svg に付いている**ため、従来の
  `button[aria-label*="画像"]` は永久に一致しませんでした。
  → `button:has(svg[aria-label="画像を追加"])` に修正。無料版・有料版・後追い修復の3つで共有。

`input[type=file]` が 0個だったのは**クリック前だから**で、押すとパネルが開き
「画像をアップロード」で OS のファイル選択が出ます（2026-07-03 に書いた元の流れが正しかった）。

【ついでに分かったこと】
コメント巡回の被覆が **65% → 93%**（190/204本）になりました。backlog を 5→15 に上げた効果です。
未巡回は残り14本。コメントは依然0件です。

【未描画が4本に増えました】
冷やしトマト / きのどくな / ひまわり に加えて **氷見牛** も同じ状態です。
**HTTPは200が返っている**ので削除ではなく、下書き・非公開の疑いが濃いです。
