owner『noteへの自動返信コメント対応して』。`docs/worker-task-note-comments.txt`（正本・2026-07-30専用タスク化）に従い、
公開済みnote記事の**未返信コメントに返信**する。今後は毎便必須（inbox消化の直後）。

手順の要点（詳細は worker-task-note-comments.txt）:
- 確認: https://note.com/notifications ＋ 直近公開10本のコメント欄（取りこぼし防止）。
- 返信: 高岡住人「てつ」で感謝＋コメントに具体1点触れる・1〜3文・使い回し禁止・絵文字0〜1。
- ★言語を合わせる（重要）: **英語コメント→英語で返信／日本語→日本語**。海外読者の英語コメントは最優先で温かく返す（フォロワー化）。
- 質問はその記事の事実検証ノートの範囲で正直に（断定しない・不明は正直に）。A4=具体店/番地は書かない。
- 返信しない＝outbox全文報告: 苦情/事実誤り指摘/けんか腰/スパム/PII（特に事実誤りは記事修正の起点＝対象記事＋全文報告）。
- 1コメント1返信・追撃しない・コメント欄で営業しない(A5)。

報告(outbox): 返信件数と対象記事（英語返信の有無も）／保留にした報告のみ案件（記事＋全文＋理由）／
コメントが無ければ「新規コメントなし」1行。self-fix権限あり・2回で通らなければ停止報告。

body: |
  owner『note自動返信コメント対応』。docs/worker-task-note-comments.txt に従い毎便コメント返信を実行。
  通知＋直近公開10本のコメント欄を確認→未返信に返信（てつ/感謝＋具体1点/使い回し禁止/1コメント1返信/A5）。
  ★英語コメントは英語で返信（North Star=海外読者）。質問は事実検証ノート範囲で正直に。
  苦情/事実誤り指摘/スパム/PIIは返信せずoutbox全文報告。報告に返信件数と対象記事（無ければ新規コメントなし1行）。

