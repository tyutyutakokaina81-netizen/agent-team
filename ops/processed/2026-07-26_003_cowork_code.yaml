      オンボーディング(言語追加)ウォールで止まっており、回答投稿できる正規ログイン状態ではない。
  - Reddit: 未ログイン。https://www.reddit.com/settings/account が /login へリダイレクト(login_wall=True)。
    ※home画面のヒューリスティックでは一瞬logged-in偽陽性が出たが、settings必須ページで未ログインを確定。
