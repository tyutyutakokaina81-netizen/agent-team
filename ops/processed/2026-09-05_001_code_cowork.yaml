■手順：(1)まずサムネを用意する。最も確実＝owner が PEXELS_API_KEY(無料)を Repo Secrets に設定→note-thumbnails を再実行→CDO/outputs/note_publisher/thumbnails/<stem>.jpg が生成。代替＝みんなのフォトギャラリー/owner写真を手動採用。(2)サムネが用意できたら **サムネ付きで公開**：python3 prepare_photos.py --then-publish --count 2 --date 2026-09-05 (または各記事を指定)。※テキストのみ公開(publish_to_note.py --text-only)はしない=owner指示『サムネあり』。(3)公開できたら **note URL を outbox に必ず報告**(URL報告なき公開は不可)。(4)各記事 basename で python3 ops/note_to_x.py --article <basename> --note-url <URL>(Xキーあれば--go)。(5)published_registry.json/ops/note_urls.tsv に反映。

