git checkout -- CDO/outputs/note_publisher/published_registry.json
git pull origin main
python3 CDO/outputs/note_publisher/publish_to_note.py --article "CMO/outputs/2026-07-29_note記事_車は第二の部屋_地方の車内の暮らし.md" --text-only
