## なぜ

11-11 に **「日本語名が取られている題材は、ローマ字が効く」** という型が分かった
（中津からあげ＝「唐揚げ」で駅そば、「からあげ」でコンビニ商品ブランド、
**`karaage` で単体の一皿に当たった**）。

この2本は**その型が分かる前に写真待ちへ送った**ので、ローマ字をまだ試していない。
とくに こたつ は、落とした理由が **「語を変えても同じ型が来る見込み」＝測っていない予測**。
予測で写真待ちにしたものを、測らずに置いておくのはよくない。

## やること

`fetch_thumbnails_wikimedia.py` を、次の語で **1記事1巡だけ** 走らせる。

1. `2026-10-13_note記事_こたつ_机の下だけを暖める` → **`kotatsu`**
   （これまで＝博物館の展示で主題が火鉢／使用中だが**人の顔が2人**＝却下型①）
2. `2026-10-14_note記事_ジンギスカン_花見で羊を焼く` → **`jingisukan`**
   （これまで＝店頭の値札／煮込み／西洋のラムチョップ／内モンゴルの廟）

⚠️ **ローマ字は日本語の手がかりが無いので 0点足切りに掛かる。**
語そのものを `JAPAN_TOKENS` に足すのが対で必要（karaage と同じ）。
足してから走らせること。足さずに走らせると候補ゼロになり、
「ローマ字でも当たらない」と**誤った結論**が残る。

## 判定は code がやる

**採否は決めないでほしい。** 候補の画像とファイル名・出典を報告に貼るだけでよい。
却下型①〜⑦（人の顔／店名・電話番号／他県の施設が主題／個人名／絵画／政治的掲示物／合成）は
こちらで見る。とくに こたつ は**人が写りやすい題材**なので、顔の有無を必ず書いてほしい。

## 当たらなかったら

写真待ちのまま（`_await_photo.txt` は消さない）。
報告に「ローマ字も空振り」と1行書いてもらえれば、こちらで記録を更新する。
**本数を増やす方向には動かないこと**（未公開の在庫が6本ある）。


