## なぜ

10-20 の記事3本を書いた（commit ef08bf3）。**サムネが決まらないとキューに入れられない**
（note の見出し画像は公開後に付けられない＝R32）。いま**未公開の在庫が9本**あり、
うち6本はオーナーの写真待ちで止まっている。**この3本は写真待ちにしたくない**ので、
まず Commons を引いてほしい。

## やること（1記事ずつ・1巡）

`fetch_thumbnails_wikimedia.py` を次の語で走らせる。**上から順に試して、当たったら止める。**

### 1. `2026-10-20_note記事_ごぼう_土のついたまま売っている根`
`ごぼう` → `牛蒡` → `ごぼう 泥つき` → `きんぴらごぼう` → `gobo`
- ⚠️ `gobo` を使うなら **先に `JAPAN_TOKENS` に `gobo` を足す**（足さないと0点足切りで候補ゼロ）
- **落とすもの**＝ヤマゴボウ・アザミなど**別の植物**／**花や葉だけ**写っているもの
  （題材は「根」）。**きんぴら（料理）は可**＝本文に一節ある
- いちばん合うのは**土のついた根がそのまま写っているもの**（本文の冒頭そのまま）

### 2. `2026-10-20_note記事_結露_窓が内側から濡れる`
`結露` → `窓 結露` → `窓ガラス 水滴` → `condensation window`
- **落とすもの**＝**外側の雨粒・霜だけ**のもの（本文は**内側**の話）／
  **窓の外の景色が主題**のもの（⚠️表札・郵便受け・近所の家が読めると A4 に触れる）
- いちばん合うのは**内側のガラスに水滴がついて下に流れている**もの
- 氷の結晶の接写は可（終盤に一節ある）が、冒頭と合うのは流れている水滴のほう

### 3. `2026-10-20_note記事_焼きまんじゅう_味がついているのは外側だけ`
`焼きまんじゅう` → `味噌だれ` → `串団子` → `yakimanju`
- ⚠️ `yakimanju` も **`JAPAN_TOKENS` に足してから**
- **落とすもの**＝**餡入りのまんじゅう**（本文は「中に何も入っていない」が肝）／
  **みたらし団子**（本文で**別物として並べている**＝取り違えると記事と矛盾する）／
  **商品パッケージ・レトルトの箱**（このシリーズで最多の却下型）
- ⚠️ **店名・のれん・看板・値札が読めるもの**はこのシリーズでいちばん多い。必ず見てほしい

## 判定は code がやる

**採否は決めないでほしい。** 候補のファイル名・出典・ライセンスと、画像そのものを報告に貼る。
却下型①〜⑦（人の顔／店名・電話番号／他県の施設が主題／個人名／絵画・イラスト／
政治的掲示物／加工・合成）はこちらで見る。

ただし**次の2点は、見て分かるなら報告に一言書いてほしい**（判定が速くなる）:
- **人の顔が写っているか**（とくに子ども）
- **文字が読めるか**（店名・業者名・電話番号・個人名・自治体名より細かい地名）

## 当たらなかったら

その記事だけ `_await_photo.txt` に追記して写真待ちにする（**理由と試した語を全部書く**）。
**ただし3本まとめて写真待ちにはしないでほしい**＝当たったものはキューに入れたい。

