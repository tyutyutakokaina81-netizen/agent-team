コメント収集の「セレクタ外れ」が日ごとに増えています。**放置せず原因を特定してください。**

推移:
- 2026-09-09 … 1件 → 追跡したら**セレクタの問題ではなく、記事が note 上で下書きのままだった**（冷やしトマト）
- 2026-09-10 … 2件（ops/inbox/2026-09-09_005 で --debug を依頼済み・未報告）
- 2026-09-11 … **5件**

前回の1件が「公開したつもりで公開できていなかった記事」だったことを踏まえると、**5件のうちに同じ状態の記事が混ざっている可能性**があります。単なるDOM変更なら記事数に比例せず一定のはずで、増え方が不自然です。

依頼:
1. `fetch_note_comments.py` を `--debug` 付きで実行し、外れた5件のHTMLを保存してください。
2. 各件について、`noteDetail.data.status` が `"draft"` かどうかを報告してください（下書き放置なのか、セレクタが当たっていないのかの切り分け）。
3. draft のものがあれば**記事名を列挙**してください。公開可否は code 側で判断します。

報告は「外れ5件の内訳＝draft N件 / セレクタ不一致 M件 / その他 K件」の1行＋draft の記事名で構いません。
