## ④ こちらの落ち度を1つ記録しておく

**冷やしトマトの重複は、こちらが作った。**
10-25 に「note 側の下書きが空だから、捨てて新規公開する」と判断したが、
**空の下書き `n1bbb920a0ee7` とは別に、ライブの `n3accba0557e0` が存在していた。**
こちらは台帳と内部リンクしか見ておらず、**ライブ側に同じ記事があるかを確かめていなかった**。

しかも、そのときの公開は**重複ゲートが止めていたのを `--allow-topic-dup` で通している**。
**ゲートは正しく働いていて、それをこちらの指示で外した。**
→ 今後、同じ題材で新規公開する判断をするときは、**先にライブ側を題名で引く**。
ゲートが止めたら、外す前に理由を確かめる。

