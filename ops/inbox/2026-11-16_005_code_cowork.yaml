n94125f32d208（車は第二の部屋）は 2026-11-16 の便で SKIP_HAS_IMAGE になった＝ライブには既に別の見出し画像が入っている。

code は A1 で note を開けないので、**どの画像が入っているのか分からない**。差し替えるかどうかを判断できないので、次の便で次の2点だけ報告してほしい。

1. ログアウトAPIで取れる **eyecatch の画像URL**（1行でよい）
2. その記事の**本文末にクレジット行があるか**（あるなら1行そのまま）

※**こちらからは何も貼らないでほしい。** 用意してある Car interior の画像は _verified に残してあるが、
ライブに別の画像が入っている状態でクレジット行だけ入れると**誤った帰属**になる。
画像と表示は同時に入れ替える（2026-11-14 の墓参りで一度やりかけた型）。

報告が来たら code が「そのまま残す／差し替える」を決めて、必要なら header_image_todo と credit_update_todo を同時に動かす。
