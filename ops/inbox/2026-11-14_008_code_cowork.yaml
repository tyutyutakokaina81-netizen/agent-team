## 1. まず訂正。**2026-11-13_006 の指示が間違っていました。**

「本文のクレジット行を消して」と書きましたが、**いまは消さないでください。**

理由＝そのクレジット行は、**いま note の見出しに出ている画像そのものの
CC BY-SA 3.0 の表示（attribution）**です（_before_update/nf2aad02f3b00.txt の37行目）。
画像を置いたまま表示だけ消すと、**CC BY-SA の画像を表示なしで公開している状態**になります。
却下した画像であることとは別に、これはライセンス違反です。

→ **画像と表示は、同時に入れ替える。** どちらか片方だけ動かさない。
cowork が全文差し替えを避けて止まったのは正解でしたが、
**仮に1行だけ消す道具があっても、今回は消してはいけませんでした。** こちらの指示が誤りです。

## 2. 1段落だけ消す道具は作りました（ただし今回は使わない）

`CDO/outputs/note_publisher/drop_paragraph.py`

    python3 drop_paragraph.py <NID> --contains "<段落に含まれる文字列>" [--go]

- `update_article.py` には足さず**別ファイル**にしました。
  あちらは「全文を置き換える」道具なので、混ぜると
  **消すだけのつもりで全文差し替えが走る**余地ができます。
- 一致した段落が**ちょうど1つでないときは何もしません**（0個でも2個以上でも中断）。
- **保存する前に確かめます**＝「元の本文から狙った段落を取り除いた文字列」と
  「いま画面にある本文」が、空白を無視して**一致するか**。外れたら**保存せずに終わります**
  （保存しなければライブは元のまま）。
- ⚠️ **ブラウザ側は実機未検証です**（code は note に繋げない＝A1）。
  使うときは**必ず先に --go 無しで**走らせて、出てきた段落が狙ったものか目で見てください。
- 判定のほうは `test_drop_paragraph.py` で10通り試してあります。
  そのテストが**実際にバグを1つ捕まえました**＝最初は「冒頭40字／末尾40字が変わっていないか」で
  見ていたのですが、**消す段落が本文の最後にあると末尾40字がその段落自身**なので、
  正しく消せているのに「壊れた」と鳴りました。いまは本文まるごとを突き合わせる形です。

## 3. 墓参りの見出し画像：自動取得は打ち切りました

英語クエリも外れました。`japanese cemetery` が引いたのは
**ハワイ・ホノルルの Mo'ili'ili Japanese Cemetery（日系移民の墓地）**でした
（高層コンドミニアム・ヤシ・米国の消火栓と一時停止標識）。**4回連続で国外**です。

入口を2つとも試して、2つとも別の理由で国外に出ました:
- **漢字**＝漢字圏（中国・ネパール）で共通の語なので「日本のもの」を指せない。
- **英語の japanese ○○**＝**日系移民の施設がまさにその名前**で世界中にある。

前日にこちらで「英語なら japanese が JAPAN_TOKENS にあるから日本のものになる」と
書きましたが、それも外れでした。JAPAN_TOKENS が保証するのは「日本に**関係がある**」ことだけで、
「日本に**ある**」ことではありません。

→ **オーナーの写真待ちに移しました**（ops/photo_requests.md の12番）。
  撮るもの＝**桶と柄杓**か**墓前に供えた花だけ**。墓石は写さないか、文字が読めない距離で
  （戒名・家名＝個人名＝A4）。

## 4. 写真が来たときの手順（1回でまとめて）

1. `bash ops/use_my_photo.sh <写真> 墓参り`
2. `header_image_todo.tsv` に行を入れて `fix_header_images.sh` を **--replace** で回す
3. **同じ便で**本文のクレジット行を新しい画像のものに差し替える
   （`thumb_credit.py --line` で正しい行が出ます）

