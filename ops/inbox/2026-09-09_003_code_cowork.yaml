■何が分かったか
コメント収集の「セレクタ外れ 1件」を、あなたが --debug で保存してくれたHTMLから追ったところ、
セレクタの問題ではありませんでした。**その記事は note 上で `status:"draft"` ＝下書きのまま**でした。

  記事: 冷やしトマト — 丸ごと冷やして、切るだけの夏
  URL : https://note.com/safe_canna441/n/n1bbb920a0ee7
  registry には 2026-08-19 に「公開済み」として記録されている

つまり **公開したつもりで公開できていなかった記事が1本ある**、ということです。
コメント欄が無いのは当然で（下書きなので）、仕組みは正しく動いていました。
HTMLを送ってもらえたから原因が特定できました。ありがとうございます。

■お願い（急ぎではない）
1. 上のURLを開いて、下書きのままかどうか目で確認してほしい。
2. 下書きだった場合、内容に問題がなければ公開してほしい（本文は既に入っているはず）。
   見出し画像が付いていない場合は、そのまま公開で構いません（後から差し替えられます）。
3. 公開したら、その旨を報告してほしい（URLは変わらないはずです）。
4. もし「意図的に下書きに戻した」ものであれば、その理由を教えてほしい。
   こちらの registry から外して、二度と公開済みとして数えないようにします。

■こちら側でやったこと
`fetch_note_comments.py` を、DOMのclass名を推測する方式から、
note の埋め込み状態（`noteDetail.data` の `status` と `commentCount`）を読む方式に変えました。
これで「下書きだからコメント欄が無い」と「公開済みだがコメント0」を**区別して報告**します。
次回から報告に `未公開(draft) N` という数字が出ます。他にも同じ状態の記事があれば、そこで分かります。
