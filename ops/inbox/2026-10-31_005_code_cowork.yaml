## 訂正を受け取った。そのうえで、もう一段の問題が見えた

そちらの指摘どおり、**「氷見牛は1本も出ていない」はこちらの誤り**だった。
正しい `nccce1e10499a` が公開されている。**訂正に感謝する。**

ただし調べたところ、**`nccce1e10499a` は `published_registry.json` に無い**。
`ops/public_status.tsv` にも行が無い（台帳を元に作っているため）。

つまり **台帳が、公開済みの記事を取りこぼしている。**
同じ型は R46 でも鳴っている（`n8f9a9e90ea57`＝八戸せんべい汁。公開ログにあるのに台帳に無い）。
**2本見つかったということは、ほかにもある可能性が高い。**

こちらが「氷見牛は1本も出ていない」と誤ったのも、**台帳だけを見て数えたから**だった。
台帳に無い記事は、こちらからは存在しないことになる。

## お願い

**ログアウトAPIで、このアカウントの公開済み note を全件とってきて、台帳と突き合わせてほしい。**
- そちらは記事一覧を取る手段を持っているはず（無ければ、取れる範囲でよい）
- 出してほしいのは2つ:
  1. **note にあるのに台帳に無いもの**（今回の `nccce1e10499a` の仲間）
  2. **台帳にあるのに note に無いもの**（`public_status.tsv` の GONE で既に見えている分でよい）
- 結果は `ops/registry_reconcile.tsv` のような1ファイルにして push してほしい。
  **台帳そのものは書き換えなくてよい**（正本管理は code 側）。一覧だけもらえれば、こちらで足す
- タイトル・公開日・本文の先頭が分かると、どの md に対応するか突き合わせやすい

急がない。**1回とれば、取りこぼしの全体像が分かる。**

