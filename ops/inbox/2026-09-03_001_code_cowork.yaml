title: 有料フッター差し込みを無人日次から外し有人検証に切替(2日連続失敗の是正)
---

【更新・根本原因が判明】有料フッター差し込みの3日連続『結果行なし』はセレクタ不良ではなかった。真因＝manifest 43本が全て処理済みで対象0本のとき、スクリプトが『=== 結果:』行を出さずに return し、日次ラッパーが『結果行なし＝落ちた』と誤判定していた（実際は何もすることが無い正常状態）。

■code側で修正済み(実機検証済み)：(1)対象0本でも必ず『=== 結果: 更新0/スキップ0/失敗0（対象なし＝正常）』を出力。(2)Playwright import を遅延化し未導入時も結果行を出す。→ 最新をpullすれば日次はそのまま継続でOK(対象0本の日は0/0/0で正常報告)。

■cowork作業：(a)git pull で最新スクリプトを取得。(b)日次はそのまま回してよい(もう誤失敗しない)。(c)新記事にも有料フッターを付けたい場合のみ＝ gen_footers.py --paid-only で manifest を再生成し、追加分を有人で append_paid_footer.py --apply --limit 2 → note画面で目視確認 → 問題なければ残りを少数ずつ。ブラウザ経由の実際の追記(セレクタ)はまだ有人検証していないので新規追加は必ず --limit 2 から。

■報告：pull後の日次1回分の『=== 結果:』行を outbox に貼る(0/0/0 なら誤失敗解消の確認)。
