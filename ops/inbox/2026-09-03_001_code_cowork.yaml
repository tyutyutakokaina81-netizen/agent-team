title: 有料フッター差し込みを無人日次から外し有人検証に切替(2日連続失敗の是正)
---

owner再確認要件の運用是正。**有料note案内フッターの差し込み(append_paid_footer.py)を無人の日次バッチから外す**。理由＝2026-09-02/03と2日連続で『結果行なし＝早期crash』(cowork報告)。本スクリプトは公開済み記事の本文にキーボード入力で追記する『書き込み』操作で、実機未検証のまま無人日次に載せるのは破壊的操作の無検証実行に当たる(会社の鉄則違反)。

■やること：(1)日次バッチの実行リストから append_paid_footer の自動実行を外す(auto-publishは継続)。(2)代わりに一度だけ有人で検証＝ `python3 CDO/outputs/note_footer/append_paid_footer.py --apply --limit 2` を実行し、note編集画面で2本の末尾に案内が正しく入り更新されたかを目視確認。今回codeが起動失敗時も必ず『結果』行を出すよう診断を強化済みなので、落ちた場合はその結果行(起動失敗/コンテキスト起動失敗の理由)を outbox に貼る。(3)2本が正しければ `--retry-failed` か通常実行で残りを少数ずつ進める。全て有人で結果を確認してから次へ。

■報告：outbox に『日次から除外済み/検証2本の結果(更新n・失敗m・理由)』。※これは撤回ではなく『無検証の無人実行を止め、有人検証に切替』。検証が通れば日次復帰を再検討。
