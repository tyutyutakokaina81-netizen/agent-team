2026-06-11 公開の「高岡万葉線 — 路面電車が日常にある」の**見出し画像が、京都市電の保存車両**
（愛知・明治村の展示）でした。万葉線（高岡）の記事の画像としては誤りです。

  記事: 2026-06-11_note記事_高岡万葉線_路面電車が日常
  画像: File:Heritage Kyoto City Tram - Meiji-mura.jpg（CC BY 2.0 / 撮影 Kzaral）

【どうして今ごろ分かったか】
サムネの出典（ファイル名・ライセンス）を後から埋め戻す処理が、**毎回同じ先頭25件を試し直すバグ**で
何日も1件も進んでいませんでした。順番に回るよう直したところ、初回でこれが出てきました。
つまり**約3か月半、別の都市の写真のまま公開されていた**ことになります。

【お願い（note 上の作業＝code にはできません）】
次のどちらかをお願いします。
  1. 見出し画像を**外す**（note 既定のサムネになります）… いちばん簡単で、誤りは消えます
  2. 適切な画像に**差し替える**… 万葉線の写真をお持ちならそれが最良です

どちらでも構いません。1でも「誤った情報が出ている」状態は解消します。

【code 側で済ませたこと】
- このファイル名を REJECTED_FILES に登録（二度と自動取得されません）
- _verified から外した（今後の公開で使われません）
- **R30 を新設**＝採用したサムネのファイル名に、記事に出てこない地名が入っていたら鳴らす。
  これまでは「クエリが土地を名乗るか」しか見ておらず、**取れてきた写真の地名は見ていません**でした。
  現在 129件を再点検して、他に該当はありません。
