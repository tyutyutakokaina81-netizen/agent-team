owner『noteの賞金ありコンテストに応募して』→ code調査で現在募集中の賞金付きは写真コンテスト**「#夏の1コマ」**（締切2026-08-23・優秀賞10名にAmazonギフト5,000円＋404美術館展示）。ownerが**クラフトコーラの写真で応募**を選択。実際の投稿は note セッションが要る（A1でcode不可）ため cowork が実施する。

【最優先：公式で規約を確認（誤情報防止＝A5）】
- 投稿前に note 公式の「#夏の1コマ」告知（https://note.com/info/n/n06beda8fc0d1 ／ コンテスト一覧 https://note.com/info/m/m1861fae39074 ）で、**正確な指定ハッシュタグ・応募規約・締切・応募点数・投稿形式（写真1枚の単独投稿か、記事に写真＋タグでも可か）**を必ず確認する。下記は検索要約ベースなので、**規約が違えば規約を優先**。

【応募内容（owner承認済み）】
- 写真：**クラフトコーラ**（庭の七輪のメスティンでスパイスを煮出す夏の情景）。
  リポジトリ内の owner実写＝`CDO/outputs/note_publisher/thumbnails/2026-08-11_note記事_クラフトコーラ_七輪でスパイスから煮出す.jpg`（A4検証済＝顔/番地/看板/ナビ/店名の写り込みなし）。
- キャプション（短め・A5：誇張なし・PIIなし。規約で字数指定があれば従う）：
  > 夏の夕方、庭の七輪にメスティンをのせて、スパイスから“コーラ”を煮出す。カルダモンの香りと炭の匂いがまじる、手のかかる夏の遊び。
- ハッシュタグ：**#夏の1コマ**（＝公式指定タグ。規約で正式名が違えばそれに従う）。任意で #クラフトコーラ #七輪 #夏 を補助的に。

【投稿方法（規約に合わせて選択）】
- 原則：**写真1枚＋上記キャプション＋#夏の1コマ の単独投稿**（写真コンテストのため写真主体が無難）。
- 規約が「記事に写真＋タグでも可」なら、8/11のクラフトコーラ記事公開時に #夏の1コマ を付ける形でも可（owner写真が見出し画像）。どちらかは公式規約に合わせて判断。
- **二重投稿に注意**：単独応募投稿とクラフトコーラ記事は別物（記事は別途 ops/inbox/2026-08-04_006 の全量公開で扱う）。応募は「写真＋#夏の1コマ」に限定。

【報告(outbox)】応募投稿の最終URL（HTTP200ライブ）＋付与した正式ハッシュタグ＋確認した規約要点（締切/応募点数）。規約が想定と違った場合はその内容も。code側で台帳（CMO/_index.md）に応募記録を反映する。

