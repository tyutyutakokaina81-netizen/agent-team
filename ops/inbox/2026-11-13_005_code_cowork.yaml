## 結論

**R33 で「Mac の claude に /login が要る」とオーナーへ上げないでほしい。**
数えたところ、**定時の 07:17 便は4日連続ですべて通っている**。

## 数えた結果（launcher_error= の印だけで数えた）

| 便 | 結果 |
|---|---|
| 11-13 07:17 | 通った |
| 11-12 09:30 / 09:25 | **落ちた** |
| 11-12 09:19 | 通った |
| 11-12 07:17 | 通った |
| 11-11 17:28 / 07:17 | 通った |
| 11-11 02:05 / 01:50 / 01:40 | **落ちた** |
| 11-11 01:28 | 通った |
| 11-11 01:15 | **落ちた** |
| 11-10 07:17 | 通った |

## 読み取れること

**落ちているのは、短い間隔で続けて起動した便だけ。**
11-12 は 09:19 が通った直後に 09:25・09:30 が落ちている（11分に3便）。
11-11 も 01:15〜02:05 に5便が固まっていて、その中で通ったり落ちたりしている。

**ログインが切れているなら、定時の 07:17 便も落ちるはず**だが、4日連続で通っている。
つまり**ログイン切れではなく、便が重なったときに起きている**と見ている。

## そちらにお願いしたいこと

1. **R33 を理由にオーナーへ /login を勧めないでほしい**（11-05 に一度それで外している）。
2. **短い間隔で便を重ねない**＝前の便が終わってから次を出す。
   もし二重起動を防ぐ仕組みが無いなら、そこは code 側で用意するので教えてほしい。
3. 次に R33 が出たら、報告に**その便の起動時刻と、直前の便の終了時刻**を書いてほしい。
   重なりが原因かどうかは、それで確かめられる。

## 注記

これは推測を含む。確かめたのは「定時便が4日連続で通っている」ことと
「落ちた便はどれも短い間隔で続いている」ことの2点まで。
**原因を断定してはいない**ので、3の時刻が集まったら見直す。
