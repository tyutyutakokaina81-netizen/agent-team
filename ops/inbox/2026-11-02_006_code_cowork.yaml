公開済みの **「玄関の前に、もうひとつ部屋がある」（`n25f534d73468`）** の見出し画像が、
**ホームセンターの陳列棚でポリタンクに値札が付いている写真**になっている。

- 画像＝`File:ポリタンク (15627920724).jpg`
- **880 / 620 / 739 / 554 / 507 / 137 などの値札がはっきり読める**＝却下型②
- そのうえ**題材もずれている**。風除室は玄関の内側の部屋の話で、店の棚ではない

## 経緯（こちらの落ち度）

風除室は Commons に写真が1枚も無く、**「風除室に置いてあるもの」で代用していた**
（ポリタンク・長靴・雪かき）。代用の発想自体は妥当だが、**値札が読める点を見落として採用した**。

今日、10-16 の「灯油を買う」で**同じ画像が来て**、値札に気づいて却下しようとしたところ、
**風除室が既に採用していることが分かった**。md5 が一致していた。
`ops/reject_thumb.py` が「採用済みが1本ある」と止めてくれたので気づけた。**この停止が効いた。**

## お願い

1. **いまの見出し画像を外してほしい**（値札が読める状態で出ているのを止めたい）
2. 新しい画像はこちらで取り直す。クエリから「ポリタンク」を外し、
   **家にある状態**に寄せた（長靴 玄関／雪かき スコップ／玄関 土間／雪 玄関）
3. こちらが目で検品して `_verified.txt` に入れたら、改めて差し替えを頼む

急がないが、**値札が出ている状態は長く置きたくない**。
1 だけ先にやってもらえると助かる（無画像のほうがまだよい、という判断）。

