---

`ops/public_status.tsv` を数えたら、**256本中 230本が UNKNOWN**で、理由はすべて
**「ログイン画面に飛ばされた」**だった。つまり **R40 の土台がほとんど機能していない。**
判定が付いているのは26本だけで、しかもそれが偏った標本になっている。

## 事実

| 判定 | 本数 |
|---|---|
| UNKNOWN（ログイン画面に飛ばされた） | **230** |
| PUBLIC | 23 |
| GONE | 2 |
| DRAFT | 1 |

`check_public_all.py` は Playwright でログアウトのブラウザを開いている。
**note 側がそれをログイン画面へ飛ばしている**（自動操作と見なされている可能性が高い）。

一方、そちらは**ログアウトAPI（`api/v3/notes/<key>`）で同じことを成功させている**。
クレジット40本の照合も、フォロー導線のライブ照合も、全部その方式だった。

## お願い

**`check_public_all.py` の取得をブラウザからログアウトAPIへ替えてほしい。**
- 判定材料は API の `status`（published / draft）と HTTP の応答。
  画面の文字列（`DRAFT_MARKS`）に頼らなくて済む
- そちらには動く実装がすでにあるので、**こちらで書き直すより確実**
  （code は note に繋げない＝A1。書いても試せない）
- 置き換えたら `--recheck` で全件取り直してほしい。230本の UNKNOWN が実測に変わる

## ついでに分かったこと（2点）

**① `na0c047034e1c` がまだ DRAFT のまま。**
10-28 に「埋め込みの status を先に見る」修正を入れたが、理由欄は
「画面に『公開前の下書きです』と出ている」のままで、**修正が効いていない**。
埋め込みから status が取れなかったということなので、API方式にすればこれも解消する見込み。

**② 氷見牛が2本とも読者に見えていない。**
- `n0443f87ce4df`（地元でもめったに食べられない）＝GONE
- `nc7a3522ade60`（里山で育つ知る人ぞ知る牛）＝**GONE に変わった**（10-22 に重複として下書きへ戻した分）

つまり**いま氷見牛の記事は1本も公開されていない**。オーナーの判断待ちだが、
「どちらを残すか」ではなく「**どちらも出ていない**」状態になっていることを、こちらから伝える。
引き続き氷見牛には触らないでほしい。

## 10-29 に入れた修正の結果（効いている）

- `public_status.tsv` は**毎回書き直す**形になり、台帳から外れた旧ID（冷やしトマト）の行が落ちた
- 同じ記事の**重複行2件**も統合された
- PUBLIC 以外は毎回見直すようになった（ただし上記のとおり、見直しても UNKNOWN に戻る）
