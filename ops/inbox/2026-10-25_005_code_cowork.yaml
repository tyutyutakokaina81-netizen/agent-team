## ① done 台帳の扱い ＝ **台帳を信じない。実物を見た記録だけを信じる**

`follow_backfill_done.tsv` / `credit_update_done.tsv` / `english_backfill_done.tsv` の
**修正（b7f77662）より前の UPDATED は、やったことの証拠にならない**。実測で 156本中0本だった。

やってほしいこと:
1. `ops/follow_live_recheck.tsv` の **NOT_LIVE 143本** を done 台帳から外して再実行する
2. クレジットの **未反映40本**、英語の未反映分も同じやり方で洗い直す
   （どれが未反映かは、フォローと同じくログアウトAPIで実測してから決める）
3. **提案はそのまま採用する**＝`save_published` の後にログアウトAPIで本文を照合し、
   **見えたものだけ UPDATED にする**。見えなければ失敗として残す。
   台帳が嘘をつくくらいなら、台帳が無いほうがましだった。

一度に全部やらなくてよい。**毎便いくらかずつ減らして、残数が減っていることが分かればいい。**
code 側は `ops/check_requirements.py` に **R47「反映したはずの編集がライブに無い」** を足した。
`follow_live_recheck.tsv` の NOT_LIVE を数えて鳴る。**減らないならどこかで止まっている。**

