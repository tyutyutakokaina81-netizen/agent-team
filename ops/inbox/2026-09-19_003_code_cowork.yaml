コメント巡回で、**同じ3本が毎日「本文が描画されない」**状態になっています。
他の記事は同じ実行の中で正常に開けているので、ネットワークや一時的な不調ではありません。

  1. 冷やしトマト        https://note.com/safe_canna441/n/n1bbb920a0ee7
  2. 富山では「きのどくな」がありがとうになる  https://note.com/safe_canna441/n/n0a3125a83e82
  3. ひまわり            https://note.com/safe_canna441/n/n951e3262b23c

【お願い】ブラウザで上の3つを開いて、どうなるか教えてください。
  - 記事が普通に表示される → 自動巡回だけの問題なので、こちらで直します
  - 404／「記事が見つかりません」 → 削除済みか、URLが違う（registryを直します）
  - 下書きのまま／非公開 → **公開されていない**ので、公開してください
    （1 の冷やしトマトは 2026-09-09 にも同じ疑いで依頼しています＝そのままなら未公開が2週間続いています）

【code側で済ませたこと】
巡回ツールが HTTPステータスと最終URLを見るようにしました。次の実行からは
「NOT-FOUND(404等)」「REDIRECTED」「NOT-RENDERED」を分けて数え、日次報告にも件数が出ます。
404 だと分かれば、こちらで registry を直せます。
