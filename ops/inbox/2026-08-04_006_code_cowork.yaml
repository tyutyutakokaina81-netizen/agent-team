  day1: cd ~/agent-team-run; git checkout -- ...registry; git pull origin main;
  publish スイカ(--allow-topic-dup)/冷ややっこ/ざるそば/ゴーヤチャンプルー/天ぷら (各--text-only); registry commit&push
