**note の発見経路を1つ丸ごと落としていました。**

2026-08-22 以降に公開した記事に  ブロックが無く、**タグ0個で公開**されています。note ではタグがタグページ経由・おすすめ経由の主要な発見経路なので、その分だけ読まれる機会を失っています。385本中295本にはタグが付いているので、途中から私（code）が書き忘れていたのが原因です。

**code側の対応は完了しています**:
- 未公開4本にタグを付与（08-25の2本・09-19の2本）
- **R23 を新設**＝公開キューの記事にタグが無い／5個未満なら BROKEN。二度と黙って落ちない
- CLAUDE.md の日次手順に「ハッシュタグ必須（5〜8個）」を明記
- 日次報告に **タグ入力失敗 N件 / タグ0個で公開 N件** を追加（従来はどこにも数えられていなかった）

**お願いしたいこと（急ぎではありません）**:
公開済みでタグが付いていない記事に、note の編集画面からタグを追加してください。1本あたり数十秒です。優先順位は**新しい記事から**（直近ほど読まれる機会が残っているため）。

対象の目安＝2026-08-22 以降に公開した記事すべて。タグの付け方は既存記事に合わせてください（題材語／富山・高岡など／カテゴリ／季節／#japan #Toyama）。

**次回の実行で「タグ入力失敗」に数字が出たら報告してください。** サムネと同じUI変更の可能性があります。
