owner『noteに公開までして／noteのマガジンにしとくか』。長編恋愛小説を **note 連載小説マガジン**として公開する。
実投稿は A1（code は外部ネット不可）ゆえ cowork/owner 側で実行。原稿・貼り付け文・マガジン設定はすべて用意済み。

対象ファイル: `projects/2026-08-16_恋愛小説_180p/note公開/`
- `00_マガジン設定_owner貼り付け用.md` … マガジン名・説明文・タグ・収録話一覧・手順
- `連載_雨晴を待つ_第01話_*.md` 〜 `第12話_*.md` … 各話の note 記事（`## タイトル` / `## 本文` 形式＝publisher 適合）

【ステップ0：マガジン作成（owner が1回だけ）】
- note →自分のページ →「マガジン」→新規作成。`00_マガジン設定_...md` の「マガジン名」「説明文」をコピペ。無料マガジン。

【ステップ1：全12話を第1話→第12話の**順番どおり**に公開】
- publisher: `CDO/outputs/note_publisher/publish_to_note.py --article <path> --text-only`
- 本文に写真placeholderは無い（純テキスト）ので `--text-only` で公開＝画像なし記事。サムネは owner が後から雨晴海岸/女岩/立山の実写を手動設定してよい。
- **第2話以降は連載共通タイトル「雨晴を待つ」がトークン衝突するため `--allow-topic-dup` を必ず付ける**（第1話は不要）。
- **1日上限5本**：publisher の日次ゲートに従う。12話＝約3日に分けて消化してよい（順番は厳守）。
- 各実行の最初に registry を pull、その日の分を公開したら registry を commit & push（既存運用と同じ）。

【day1（第1〜5話）】
```
cd ~/agent-team-run
git checkout -- CDO/outputs/note_publisher/published_registry.json
git pull origin main
BASE="projects/2026-08-16_恋愛小説_180p/note公開"
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/連載_雨晴を待つ_第01話_海の見える駅.md" --text-only
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/連載_雨晴を待つ_第02話_汀という喫茶店.md" --text-only --allow-topic-dup
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/連載_雨晴を待つ_第03話_ほたるいかの夜.md" --text-only --allow-topic-dup
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/連載_雨晴を待つ_第04話_女岩の約束.md" --text-only --allow-topic-dup
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/連載_雨晴を待つ_第05話_白えびの季節.md" --text-only --allow-topic-dup
git add CDO/outputs/note_publisher/published_registry.json && git commit -m "publish: 連載雨晴 day1(第1-5話)" && git push origin main
```

