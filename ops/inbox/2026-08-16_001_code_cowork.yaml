【ステップ2：各話をマガジンに追加】
- 公開できた記事を、作成した「連載小説『雨晴を待つ』」マガジンへ **第1話→第12話の順**に追加。
- 可能なら各話末尾の「次話へ続く」に次話URLをリンク（回遊UP・任意）。

【報告】
- outbox へ：公開できた話数（例 5/12）、各話の公開URL、マガジンURL、失敗があれば理由（既知の Playwright 認証/UI 起因かどうか）。
- ★既知の課題：8月に入り自動公開が Playwright 起因で 0/N が続いている。もし今回も同事象なら、**まず認証セッション再取得（login state 更新）を試し**、それでも駄目なら owner が手動でコピペ公開（`00_マガジン設定_...md` の本文をそのまま貼る）に切替。手動でも順番は第1話→第12話厳守。

【厳守】
- A5：煽り・誇張タイトルにしない（原文のまま）。連投スパムにしない（1日上限5本・順番厳守）。
- A4：本文は市/公共施設レベルのみ（対応不要・既に順守済み）。
- 規約順守：note の連載/マガジン仕様に沿う。多重投稿・自動化がアカウントリスクにならない範囲で。
