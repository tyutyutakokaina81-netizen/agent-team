owner『サムネも入れて／noteの有料マガジンにして／日本語と英語を併記して／公開』。
code側で"公開できる形"まで用意済み（実投稿はA1でcode不可＝cowork/owner=Playwright実行、サムネ実画像はA2/A3でクラウド/owner取得）。

対象: `projects/2026-08-16_恋愛小説_180p/note公開_有料併記/`
- `00_有料マガジン設定とサムネ仕様.md` … マガジン名/説明文(日英)/価格/構成/サムネ検索語表/表紙案
- `01〜12_雨晴を待つ_第NN話_*.md` … 各話（**日英併記**）。第1-3話=無料(`##本文`)、第4-12話=有料(`##無料部分/##有料部分`, `<!-- PAYWALL price=500 -->`)。全12話パーサー検証OK。

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
【STEP A：サムネ＝★実写のフリー写真（owner指示「実写がいい」）】
- 舞台は実在地（雨晴海岸/女岩/立山連峰/海王丸/新湊内川）＝**Wikimedia Commons に実写が豊富**。無料・実写で authentic に。
- 取得元（無料・実写）：①Wikimedia Commons(キー不要・本命)→②Pexels(無料・一般カット補完)→③note みんフォト(owner編集画面で「写真」を選ぶ)。
- **取得〜採用（cloud/owner。A1でcodeは画像取得不可）**：
  1. 下記検索語で各話1枚の横長・写真を取得。
  2. `CDO/outputs/note_publisher/thumbnails/{記事stem}.jpg` に保存。
  3. owner 目視verify → `CDO/outputs/note_publisher/thumbnails/_verified.txt` に stem 追記。
     → **無料3話(publish_to_note)は見出し画像自動採用**、**有料9話(publish_paid_note)は編集画面で同画像を見出しに設定**。
  4. Wikimedia実写は**記事末にCC表記**（作者/ライセンス/リンク）必須。
- 検索語（Wikimedia/Pexels・詳細は `00_…サムネ仕様.md` §3）：
  1=Amaharashi Coast Toyama sunrise sea ／2=seaside cafe coffee window sea japan ／3=firefly squid Toyama night sea ／
  4=Amaharashi Meiwa rock Tateyama sea ／5=shiraebi white shrimp Toyama ／6=Kaiwo Maru sailing ship full sail ／
  7=old letters sepia photograph drawer ／8=autumn sea coast japan grey ／9=Shinminato Uchikawa canal sunset Toyama ／
  10=yellowtail buri fish winter Toyama ／11=snow coast japan winter sea ／12=Tateyama snow sunrise sea Amaharashi ／
  表紙=Amaharashi Coast Tateyama mountains sea sunrise。
- 自動取得を回すなら Actions「Generate note thumbnails」手動Run（既定対象は CMO/outputs のため、本連載を含めるには owner手動取得 or CDOへ対象パス追加依頼）。当面は owner手動取得＋verify が確実。
- A4/A5：特定の私有地・個人が写る写真は選ばない。誇張キャプションにしない。

【STEP B：有料マガジンを作成（owner・1回）】
- note→マガジン→新規作成。`00_…サムネ仕様.md` の「マガジン名／説明文(日英)」を貼付。
- **有料マガジン・¥500（一括買い切り）** に設定（価格はCFO/owner最終判断＝¥300〜¥500目安）。表紙画像を設定。

【STEP C：第1〜3話（無料看板）を公開】※順番厳守・第2,3話は連載共通タイトルゆえ --allow-topic-dup
```
cd ~/agent-team-run
git checkout -- CDO/outputs/note_publisher/published_registry.json && git pull origin main
BASE="projects/2026-08-16_恋愛小説_180p/note公開_有料併記"
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/01_雨晴を待つ_第01話_海の見える駅.md" --text-only
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/02_雨晴を待つ_第02話_汀という喫茶店.md" --text-only --allow-topic-dup
python3 CDO/outputs/note_publisher/publish_to_note.py --article "$BASE/03_雨晴を待つ_第03話_ほたるいかの夜.md" --text-only --allow-topic-dup
git add CDO/outputs/note_publisher/published_registry.json && git commit -m "publish: 雨晴 無料看板 第1-3話(日英)" && git push origin main
```
- サムネ verify 済みなら見出し画像は自動採用。未verifyなら無サムネで公開→後から owner が手動設定可。

【STEP D：第4〜12話（有料）を公開】※publish_paid_note.py・安全ゲート付き（既定は下書き保存で止まる）
- まず1本を下書きで確認 → 問題なければ --publish。**1日上限を意識し数日に分けてよい**。
```
cd ~/agent-team-run
BASE="projects/2026-08-16_恋愛小説_180p/note公開_有料併記"
# 下書き確認（--publishなし＝タダ公開しない安全既定）
python3 CDO/outputs/note_publisher/publish_paid_note.py --article "$BASE/04_雨晴を待つ_第04話_女岩の約束.md" --price 500
# 内容/有料ライン/価格OKなら公開
python3 CDO/outputs/note_publisher/publish_paid_note.py --article "$BASE/04_雨晴を待つ_第04話_女岩の約束.md" --price 500 --publish
# 以下 05〜12 も同様（各話 --price 500、確認→--publish）
```
- 各有料記事は公開後、**STEP B の有料マガジンに追加**（第1→第12話の順）。マガジン購入で第4-12話が解放される。

【STEP E：報告（outbox）】
- サムネ取得/verify 数、無料3話の公開URL、有料9話の公開URL、マガジンURL、価格。失敗は理由（特に既知の Playwright 認証/UI 起因か）。

