【厳守・注意】
- **絶対にタダで有料話を公開しない**：publish_paid_note.py は有料ライン＋価格が確定した時のみ公開（未確定は下書きで停止）。--publish を付けるのは下書き確認後。
- **A5**：煽りタイトル/誇張しない（原文のまま）。日英併記の本文はそのまま。連投スパムにしない（順番厳守）。
- **A4**：本文・サムネとも市/公共施設レベルのみ（対応不要＝既に順守）。特定私有地/個人が写る写真は選ばない。
- **既知課題**：8月に入り自動公開が Playwright 起因で 0/N。今回も同事象なら①認証セッション再取得→②手動でコピペ公開（無料話は本文、有料話は無料部分＝公開領域/有料部分＝有料エリアに貼り分け）。順番は第1→第12話厳守。
