---

owner『2000文字 公開して』。クラフトコーラ記事（本文を約2000字に加筆済み）を publish_to_note.py で公開する。
**owner実写サムネ（七輪のメスティンでスパイスを煮出す・IMG_0298）を _verified.txt 登録済**
＝publisher修正により見出し画像が自動で入る（実行時「🖼️ 自動サムネ候補: …jpg」表示を確認）。**⚠️訂正：本文に[写真①②]placeholderがあるため `--text-only` は必須**（付けないと「--photosに写真がありません」で中断＝2026-08-02実際に中断を確認）。`--text-only` を付けても _verified 登録済みの owner実写サムネは見出し画像に自動採用されるので問題なし。

【重複防止（過去のじゃがいも二重投稿の教訓）】
- 最初に `git checkout -- CDO/outputs/note_publisher/published_registry.json` → `git pull origin main`。
- 公開後、追記された registry を commit & push。

【実行コマンド（agent-team-run・mainのまま・完全パス）】
```
cd ~/agent-team-run
git checkout -- CDO/outputs/note_publisher/published_registry.json
git pull origin main
python3 CDO/outputs/note_publisher/publish_to_note.py --article "CMO/outputs/2026-08-11_note記事_クラフトコーラ_七輪でスパイスから煮出す.md" --text-only
git add CDO/outputs/note_publisher/published_registry.json && git commit -m "publish: クラフトコーラ" && git push origin main
```

【題材トークン誤検知の対処】既存の飲みもの記事(麦茶/冷やし甘酒 等)とゲートが「題材トークン衝突」で止まったら、
別題材(スパイスから煮出す自家製コーラ)であることを確認の上、`--allow-topic-dup` を付けて再実行。

【報告(outbox)】公開した記事の最終URL（HTTP200ライブ確認）＋見出し画像（owner実写）が入ったか。

