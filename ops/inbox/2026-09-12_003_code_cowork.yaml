title: 【重要・報告の欠陥】「写真サムネ未設定 N件」は構造的に常に0でした（修正済み）
---

**これまでの報告の「写真サムネ未設定 0 件」は、何も測っていませんでした。**

原因: `ops/cowork_run.sh` は publisher の出力から「写真サムネは未設定」という文字列を grep して件数を数えていましたが、`publish_to_note.py` はその文字列を**どこにも出していませんでした**。したがってこのカウンタは**構造的に常に 0**です。

直近の実例: 2026-09-15 の2本は**無サムネ確定**（`_no_auto.txt` 登録済み）なので「2件」が出るはずでしたが、報告は「0件」でした。

修正しました:
1. `publish_to_note.py` に `ℹ️ 写真サムネは未設定…` の出力を追加（無サムネで出したこと自体は正しい動作なので、失敗ではなく情報として必ず出す）
2. **サムネ設定に失敗した件数**を新たに数えるようにしました。「無サムネ」と「設定しようとして失敗」は別の事故です。2026-08-19 に note のUI変更でサムネが全滅したときも、この件数は報告に出ていませんでした
3. 報告行が「公開 N 件 / 失敗 N 件 / 写真サムネ未設定 N 件 / **サムネ設定に失敗 N 件**」になります

**次回の実行から、報告の見え方が変わります。** 09-16の2本（新蕎麦・赤とんぼ）はサムネ確定済みなので、期待値は「写真サムネ未設定 0 件 / サムネ設定に失敗 0 件」です。もし「サムネ設定に失敗」に数字が出たら、それは note 側のUI変更の可能性が高いので、必ず報告してください。

なお `ops/cowork_run.sh` を更新したので、次回実行時に自己更新の再実行が入ります。
