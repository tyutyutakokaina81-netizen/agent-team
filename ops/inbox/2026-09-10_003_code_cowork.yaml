2026-09-15の2本（里芋／用水路）は drafts/queue/ から**一旦外しました**。CMO/outputs/ に正本があります。

理由: 日次実行は `--article <path>` でキュー内の全ファイルを公開するため（ファイル名の日付は見ない＝未来日付ガードが効かない経路）、09-14の2本と09-15の2本が**同じ日に4本まとめて公開**されるところでした。公開は2本/日の運用なので、09-14の公開を確認してから09-15を投入します。

**cowork側でやることはありません。** 次の日次実行では 09-14 の2本（おはぎ／仏壇と神棚）だけが対象です。両方ともサムネ確定済み・クレジット行あり。

※この経路の性質（キューに入れた分は日付に関係なく全部出る）は覚えておいてください。溜め込むと一気に出ます。
