## 何が起きているか

公開済みの **墓参り**  の**本文末尾に、
却下した画像のクレジット行が出たまま**になっている。

該当の行（本文の、英語要約の直前あたり）:

  （見出し画像：(千葉県) 大山千枚田の彼岸花 - panoramio.jpg ／ 撮影 Shift ／ CC BY-SA 3.0 …
   ／ ※撮影地は富山県外）

この画像は **2026-09-29 に全記事で却下**している。却下理由は3つ:
1. **彼岸花は「2026-09-01_彼岸花」という別記事の題材**（この記事は墓参りの話）
2. **右下に透かし文字が入っている**
3. 撮影地が千葉（富山県外）

 で **LIVE_OK** になっている＝**読者に見えている**。

## こちらで直したこと（md 側）

-  から外した／jpg を消した／**md からクレジット行を消した**
- **根本原因も直した**＝この記事の JP_QUERY の先頭が「彼岸花 墓地」だった。
  **別記事の題材語を、よその記事の検索語の先頭に置いていた**のが原因。
  彼岸花を外して「供花／墓地 日本／卒塔婆／墓石 花」にした。

## お願いしたいこと（2つ。1と2は別の話）

### 1. まず確かめてほしい（これが分からないと2が決められない）
**この記事に、いま note 側で見出し画像が設定されているか。**
- 設定されている → その画像は何か（上の千葉の棚田か、別のものか）
- 設定されていない → その旨

### 2. 本文のクレジット行を消してほしい
画像が却下済みなので、**この行は残しておくと読者に嘘を伝える**（使っていない画像の出典を
表示していることになる）。本文から**その1行だけ**消してほしい。
ほかの行・英語要約・ハッシュタグは触らない。

