name: Generate note thumbnails
# provenance と実jpgの齟齬を防ぐ：スクリプトは out.exists() を必ず確認して再取得する。

# note記事のサムネ画像をクラウド(ネット可)で取得し、thumbnails/ にコミットする。
# code はネット遮断・オーナーのMacはキー貼り間違いが起きるため、ここで一括取得する。
#
# ★¥0原則(A2/A3)：有料の画像生成AI(Gemini/Imagen 等)は使わない。無料の実写のみ。
# 画像ソース（優先順・すべて無料）:
#  1. Wikimedia Commons … キー不要・完全無料。記事題材の実写を取得（既定）。
#  2. Pexels (無料素材)  … PEXELS_API_KEY(無料)があれば、1で埋まらなかった分を実写で補完。
#
# キーは リポジトリ Settings > Secrets and variables > Actions に登録（ターミナルに貼らない）。
#  - PEXELS_API_KEY : https://www.pexels.com/api/ （無料）
# ※ 有料APIキー(GEMINI_API_KEY 等)は登録しない＝課金の発生源を持たない。
#
# 実行: Actions タブ → "Generate note thumbnails" → Run workflow（手動）

on:
  # 2026-07-27 ★自動トリガー(push)を再有効化(owner承認)。owner「サムネ入り」の毎回手動Runをなくす。
  # 以前OFFにした理由(誤サムネの自動公開・owner実写の上書き)は下記2重ガードで解消済み＝
  #  (1) publisher: _verified.txt に載る owner確認済みstemのみ見出し画像に採用（未検証は無サムネ公開）。
  #  (2) fetcher: _verified.txt 掲載stemは自動取得で上書きしない(--forceでも)＝owner実写を守る。
  # ゆえに自動取得しても、取得画像は thumbnails/ に置かれるだけで、code が目視verifyして
  # _verified.txt に登録するまで本文公開に一切使われない（誤サムネ事故は起きない）。
  # bot は thumbnails/ と _provenance.json のみ commit するため push ループにならない。
  push:
    branches: [main]
    paths:
      - "CMO/outputs/**"          # 新記事push時に自動取得
      - "ops/run_requests/**"     # code の公開便トリガーpush時にも自動取得(=便を出す度にサムネ更新)
  workflow_dispatch:
    inputs:
      filter:
        description: "対象を絞る日付など (例 2026-06-09)。空なら全記事の不足分。"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: note-thumbnails
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # ¥0原則(A2/A3)：有料の画像生成AIは使わない。無料の実写ソースのみ。
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FILTER: ${{ github.event.inputs.filter }}
    steps:
      - uses: actions/checkout@v4

      # 1) Pexels 無料素材を優先（キュレーション済み＝暮らし/食/自然の実写に強い。無料キー）。
      #    2026-07-30 順序をPexels優先に変更：Wikimediaは概念語(温泉/川/そうめん)で無関係画像や
      #    別地域(海外の地質/会社ビル/春の桜川)を返しやすく、先に書くとPexelsを塞いでいた（実測）。
      #    → まずPexelsで質の良い実写を取り、埋まらなかった分だけ後段のWikimediaで補完する。
      - name: Fetch real photos (Pexels, free curated stock)
        if: ${{ env.PEXELS_API_KEY != '' }}
        run: |
          if [ -n "$FILTER" ]; then
            python3 CDO/outputs/note_publisher/fetch_note_thumbnails.py --filter "$FILTER" || true
          else
            python3 CDO/outputs/note_publisher/fetch_note_thumbnails.py || true
          fi

      # 2) Wikimedia Commons（キー不要）で、Pexelsで埋まらなかった分だけ補完（既存jpgは上書きしない）。
      #    固有の地名/名所(高岡大仏/立山 等)はWikimediaが強い＝フォールバックとして有効。
      - name: Fill remaining with Wikimedia Commons (keyless fallback)
        run: |
          if [ -n "$FILTER" ]; then
            python3 CDO/outputs/note_publisher/fetch_thumbnails_wikimedia.py --filter "$FILTER" || true
          else
            python3 CDO/outputs/note_publisher/fetch_thumbnails_wikimedia.py || true
          fi

      # ※ 有料AI生成(Gemini/Imagen)経路は撤去（¥0原則・A2/A3）。ランダムPicsumも廃止。
      #   取得できなかった記事はサムネ無しで残し（provenance未記録）、次回トリガーで再取得（自己修復）。
      #   note見出しは みんなのフォトギャラリー 手動採用も可。

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f CDO/outputs/note_publisher/thumbnails/*.jpg || true
          git add -f CDO/outputs/note_publisher/thumbnails/_provenance.json || true
          if git diff --cached --quiet; then
            echo "サムネ更新なし（取得ゼロ）＝commit/pushしない"
            exit 0
          fi
          git commit -m "auto: note用サムネを無料実写(Wikimedia/Pexels)から取得"
          # push前に main の進みを取り込む（並行commitでの非fast-forward拒否を回避）。最大5回リトライ。
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "push成功"; exit 0; }
            echo "push失敗（$i回目）→再取得して再試行"
            sleep 3
          done
          echo "::error::5回試しても push できませんでした"
          exit 1
